; S3 8V exhaust valve controller
;
;   pio run -e esp32dev            build firmware
;   pio run -e esp32dev -t upload  flash it
;   pio device monitor             serial console at 115200
;   pio test -e native             run the host unit tests
;
; Wiring lives in src/board_config.h. Override pins here with build_flags
; instead of editing that file.

[platformio]
default_envs = esp32dev

[env]
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    coryjfowler/mcp_can@^1.5.0
build_flags =
    ${env.build_flags}
    ; -D CAN_CRYSTAL_MHZ=16   ; uncomment if your MCP2515 board has a 16 MHz can
    ; -D RELAY_ACTIVE_LOW=1   ; uncomment for opto-isolated relay boards

[env:native]
platform = native
test_framework = custom
; The Arduino entry point must not be dragged into the host build.
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -D UNIT_TEST
